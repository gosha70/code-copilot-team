# Claude Code adapter capability classification (FR-029).
#
# Present so parity reporting compares two classified adapters rather than
# comparing Pi against an assumed baseline. Ids must exist in catalog.yaml.
#
# Validated against shared/schemas/capability.schema.json.
schema_version: 1
kind: adapter
adapter: claude-code

capabilities:
  - id: skills.shared
    implementation_kind: native
    runtime_status: enabled
    status_probe: "Skills installed under ~/.claude/skills by setup.sh."

  - id: prompts.commands
    implementation_kind: native
    runtime_status: enabled
    status_probe: "Commands installed under ~/.claude/commands by setup.sh."

  - id: config.layered
    implementation_kind: native
    runtime_status: degraded
    reason: >-
      settings.json resolves through a documented precedence, but resolved
      values carry no provenance and there is no explain surface.
    status_probe: "settings.json present; no provenance API exists to probe."

  - id: config.trust-gating
    implementation_kind: native
    runtime_status: enabled
    status_probe: "Workspace trust prompt is enforced by the host application."

  - id: workflow.sdd
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "Plan/build agent manifests gate on plan.md frontmatter."

  - id: workflow.phases
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "Phase agents plus the /phase-complete command are installed."

  - id: permissions.engine
    implementation_kind: native
    runtime_status: enabled
    status_probe: "settings.json permissions block resolved by the host application."

  - id: permissions.protected-paths
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "protect-files.sh and protect-git.sh registered as PreToolUse hooks."

  - id: providers.pi
    implementation_kind: optional-bridge
    runtime_status: disabled
    reason: >-
      Claude Code can invoke Pi as a peer-review provider, but the reviewer
      execution contract has not passed its acceptance gates.
    status_probe: "providers-health.sh check for a working pi-code."

  - id: review.enforcement
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "peer-review-on-stop.sh blocks session end until loop-summary.json is PASS/bypass."

  - id: verification.enforcement
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "verify-on-stop.sh runs the gate suite at session end (blocking when HOOK_STOP_BLOCK=true)."

  - id: integrations.mcp
    implementation_kind: native
    runtime_status: enabled
    status_probe: "MCP servers configured in settings.json are attached by the host."

  - id: integrations.hosted-platform
    implementation_kind: native
    runtime_status: enabled
    reason: >-
      Claude Code is the first-party client for these services, so they are
      native here and external-platform elsewhere.
    status_probe: "Provided by the host application."

  - id: memory.session-state
    implementation_kind: cct-first-party
    runtime_status: enabled
    reason: >-
      Claude Code's PreCompact/PostCompact hooks checkpoint before compaction
      and recover after — a true pre-compaction hook (Pi has no such event).
    status_probe: "PreCompact/PostCompact hooks checkpoint + recover session state."

  - id: security.sandbox
    implementation_kind: cct-first-party
    runtime_status: disabled
    reason: >-
      Pi-runtime sandbox provider (FR-019). The Claude Code adapter relies on
      host + permission-mode controls and does not implement the CCT sandbox
      detection/gate; reported disabled rather than overclaimed.
    status_probe: "Not implemented in the Claude Code adapter."

  - id: security.env-scrub
    implementation_kind: cct-first-party
    runtime_status: disabled
    reason: >-
      Pi-runtime env scrubbing (#173). The Claude Code adapter does not
      implement the CCT spawn-boundary scrub (its sandboxing and subagent
      spawning are native surfaces); reported disabled rather than
      overclaimed.
    status_probe: "Not implemented in the Claude Code adapter."

  - id: memory.promotion
    implementation_kind: cct-first-party
    runtime_status: enabled
    reason: >-
      Claude Code promotes memories to its persistent memory layer and can reach
      MemKernel over MCP for code-aware retrieval.
    status_probe: "Native memory + MemKernel MCP server."

  - id: agents.subagents
    implementation_kind: native
    runtime_status: enabled
    reason: >-
      Claude Code runs subagents as native SDK child sessions defined by
      `.claude/agents/*.md` manifests, dispatched through the Agent tool.
    status_probe: "Native Agent tool + .claude/agents/*.md manifests."

  - id: agents.worktrees
    implementation_kind: cct-first-party
    runtime_status: disabled
    reason: >-
      Claude Code isolates parallel subagents in native git worktrees (Agent
      isolation: "worktree"), but the CCT worker/ownership/verification/merge/
      cleanup ledger (FR-013) is not implemented in the Claude adapter; reported
      disabled rather than overclaimed.
    status_probe: "Native Agent worktree isolation; no CCT worktree ledger."

  - id: agents.teams
    implementation_kind: cct-first-party
    runtime_status: disabled
    reason: >-
      Claude Code ships native Agent Team configurations, but the CCT
      team-coordination ledger (FR-012 shared ledger / claiming / plan approval /
      controlled shutdown) is not implemented in the Claude adapter; reported
      disabled rather than overclaimed.
    status_probe: "Native Agent Team configs; no CCT team ledger."
