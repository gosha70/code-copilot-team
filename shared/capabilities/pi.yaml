# Pi adapter capability classification (FR-029).
#
# Ids must exist in catalog.yaml. Statuses flip only when the acceptance gates
# named in the spec pass (FR-028) — PATH presence never implies `enabled`.
#
# Validated against shared/schemas/capability.schema.json.
schema_version: 1
kind: adapter
adapter: pi

capabilities:
  - id: skills.shared
    implementation_kind: native
    runtime_status: enabled
    status_probe: "Agent Skills directory present in the installed package resources."

  - id: prompts.commands
    implementation_kind: native
    runtime_status: enabled
    status_probe: "Prompt templates present in the installed package resources."

  - id: config.layered
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "Runtime resolved a layered configuration with provenance."

  - id: config.trust-gating
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "project_trust observer registered and isProjectTrusted() gate active."

  - id: workflow.sdd
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "SDD build gate registered on tool_call."

  - id: workflow.phases
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "Phase state loaded or initialized for the project."

  - id: permissions.engine
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "Permission rule set built from resolved configuration."

  - id: permissions.protected-paths
    implementation_kind: cct-first-party
    runtime_status: enabled
    status_probe: "Protected-path matcher active on write and edit tool calls."

  - id: providers.pi
    implementation_kind: cct-first-party
    runtime_status: enabled
    reason: >-
      The read-only reviewer execution contract (T3.1-T3.4) passes its
      acceptance suite (scripts/pi-provider-acceptance.sh) — the single source
      of truth. Enablement is bound to that suite by test-pi-provider-gate.sh;
      PATH presence never implies enabled. pi binary availability is gated
      separately by the pi-code doctor health probe.
    status_probe: "scripts/pi-provider-acceptance.sh (bound by tests/test-pi-provider-gate.sh)."

  - id: review.enforcement
    implementation_kind: cct-first-party
    runtime_status: degraded
    reason: >-
      Mandatory review is gated at /cct:phase-complete and the review->next
      transition — the only Pi-observable seam, since Pi emits no Stop/turn-end
      event. Weaker than Claude's Stop-hook gate, which fires even when the
      workflow commands are never run.
    status_probe: "reviewGate() at /cct:phase-complete and the review->next transition."

  - id: verification.enforcement
    implementation_kind: cct-first-party
    runtime_status: degraded
    reason: >-
      Verification gates block at /cct:phase-complete and the review->next
      transition (Pi emits no Stop/turn-end event); type-check runs
      `tsc --noEmit` over the runtime when typescript is installed (else
      `unsupported`); generic lint and dependency audit still report
      `unsupported`, never a fake pass.
    status_probe: "verifyGate() over the configured verification.required list."

  - id: integrations.mcp
    implementation_kind: optional-bridge
    runtime_status: degraded
    reason: >-
      MCP provider interface present (FR-018 modes) with MemKernel as the first
      audited backend — declared, connectivity-probed (PATH, never spawned),
      trust-gated, reported via /cct:mcp; no backend is silent (P6). Degraded
      because live tool invocation flows through Pi's own MCP transport, which
      the extension does not own. Opt in with integrations.mcp.enabled.
    status_probe: "resolveMcpBackends()/probeBackend()/mcpReport(); /cct:mcp reports each declared backend."

  - id: integrations.hosted-platform
    implementation_kind: external-platform
    runtime_status: unavailable
    reason: >-
      Anthropic-hosted services are external platforms; never claimed as Pi
      parity.
    status_probe: "Not probed — external platform by definition."

  - id: memory.session-state
    implementation_kind: cct-first-party
    runtime_status: degraded
    reason: >-
      Session state persists to .cct/pi-session.json and recovers into context
      at session start; checkpoints are taken at explicit CCT actions (phase
      transitions, /cct:checkpoint) because Pi emits no observable compaction
      event — not a pre-compaction hook, hence degraded.
    status_probe: "loadCheckpoint()/recoveryDigest() at session_start; writeCheckpoint() on /cct:checkpoint + phase transition."

  - id: security.sandbox
    implementation_kind: cct-first-party
    runtime_status: degraded
    reason: >-
      Enforces the autonomous/ci no-unrestricted-host rule — rejects tool
      execution (fail-closed) when a sandbox is required but the environment is
      host-unrestricted and no override is set. Detection is best-effort: Docker
      via cgroup/.dockerenv; micro-vm / remote-sandboxed via an operator
      CCT_SANDBOX declaration. The runtime cannot itself create a sandbox.
    status_probe: "detectSandbox()/sandboxGate() at session_start; tool_call denial when blocked."

  - id: memory.promotion
    implementation_kind: cct-first-party
    runtime_status: degraded
    reason: >-
      Built-in store (.cct/memory.json) is authoritative: /cct:remember,
      /cct:memory, /cct:memory-forget, wiki-first /cct:recall, provenance, and a
      fail-closed sensitive-memory control (a secret-bearing fact is refused).
      MemKernel is an MCP server, so code-aware delegation waits on the Pi MCP
      provider (integrations.mcp, T10.2); until then it reports pending-MCP.
    status_probe: "promoteMemory()/recall() over .cct/memory.json + knowledge/wiki; memkernelStatus() reports MCP availability."

  - id: agents.subagents
    implementation_kind: cct-first-party
    runtime_status: degraded
    reason: >-
      Subagents run as isolated out-of-process `pi --mode json` child sessions
      over T7.1 manifests (T7.2, FR-011). ENFORCED via verified pi CLI flags:
      per-agent model (--model), thinking (--thinking), tools (--tools) and
      separate context (--no-session); plus CCT-imposed wall-clock timeout,
      AbortSignal cancellation, and concurrency/recursion caps
      (autonomy.max_concurrency / max_recursion). Degraded because pi exposes no
      native subagent primitive, no result contract, and no
      permission-mode/skills/max-turns surface — the delegation, caps, and typed
      result are CCT-first-party scaffolding, and permissions/skills/context
      beyond isolation are reported not-enforced, never faked. Opt in with the
      agents.subagents_enabled config gate.
    status_probe: "buildChildArgv()/runChildSession() spawn pi --mode json with a typed ChildResult; caps.ts bounds concurrency/recursion. T7.1 importClaudeAgents()/validateManifest() over .claude/agents frontmatter."
