status: finalized
feature_id: auto-build-cap-alerts

FR-1:
  statement: "`api.alerts.auto_build_alerts(runs, *, now=None)` takes the `runs` list of `api.auto_build.list_runs()` and returns one alert per run per cap that is at or above `BUDGET_WARNING_SHARE` (0.8) of the cap, for runs that have not `concluded`. Cost share is `(cost.metered_usd + cost.estimated_usd) / caps.cost_usd`; wall-clock share is `elapsed_sec / caps.wall_clock_sec`. A cap that is null or not positive yields no alert. Level is `warning` at or above the share and below the cap, `breach` at or above the cap."
  statement_sha: "sha256:76c120b8cf769bd6e07bc1f73b5b31f5bc807b714796a8f0f8034c5a0120ccb2"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_alerts.py -q -p no:cacheprovider -k cap_fr1"
FR-2:
  statement: "Each alert is a dict with `kind` in {`auto-build-cost`, `auto-build-wall-clock`}, `level`, `scope: \"run\"`, `subject: {key, feature_id, ledger, pr_number}`, `window: null`, `figures` carrying the spent/elapsed value, the cap and the share (rounded to two decimals), and a `message` that names the feature id, the run key, the value against the cap as a percentage, and for cost the estimated portion when it is non-zero (e.g. \"auto-build run team-developer-aliases (47908-474720888) has spent $7.30 of its $10.00 cap (73%, $2.00 estimated) and is still running\")."
  statement_sha: "sha256:a9057737e1d2795777177a884dc7300c89dc6f5c6a88475ec35d94125f05e879"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_alerts.py -q -p no:cacheprovider -k cap_fr2"
FR-3:
  statement: "`all_alerts()` includes the auto-build alerts whenever a `runs` list is passed (new keyword argument `runs`, default `None` meaning \"not evaluated\"), sorted with the others by level, and the report gains `auto_build: {evaluated: bool, live_runs: int}`. `render_alerts()` prints the auto-build line like the others and, in the configuration lines, says whether auto-build runs were evaluated and how many were live."
  statement_sha: "sha256:d3f1ba4eb168b049ece0ae041459b0f0545c36e0ead8118fed6e3839494dc2d0"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_alerts.py -q -p no:cacheprovider -k cap_fr3"
FR-4:
  statement: "`GET /api/team/status`, `GET /api/team/alerts` and `session-analytics team status|alerts` evaluate auto-build alerts by reading the ledgers through `api.auto_build.list_runs()` with the loaded `auto_build` config; a ledger root that is not a directory yields `evaluated: true` with zero runs and no alert; the existing exit-code behaviour of `team alerts --fail-on` applies to them."
  statement_sha: "sha256:7acff5a8b8edb517be4308a5df0090e67b3146fba3e9b90d6f2838a9c995d984"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_alerts.py scripts/session_analytics/tests/test_cli.py -q -p no:cacheprovider -k cap_fr4"
