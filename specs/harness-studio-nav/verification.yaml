status: finalized
feature_id: harness-studio-nav

FR-1:
  statement: "`studio/lib/nav.ts` exports `PRODUCT_NAME` equal to `Harness Studio`, and `studio/app/layout.tsx` imports `PRODUCT_NAME` from `@/lib/nav` and uses it for both the document title metadata and the header wordmark, so the product name has one source rather than a literal per site. Neither `studio/app/layout.tsx` nor `studio/README.md` contains the string `Session Analytics Studio`, and `studio/README.md` names `Harness Studio`."
  statement_sha: "sha256:bae39f463b10294054582325c271278377b80cabe84bebda1d1a38064bfb0a71"
  verifiers:
    - kind: deterministic
      test: "node studio/scripts/nav-check.mjs FR-1"
FR-2:
  statement: "`studio/lib/nav.ts` exports `NAV_GROUPS`, an array of exactly three groups in the order `mission-control` / `Mission Control`, `development` / `Development`, `library` / `Library`. Mission Control holds, in order, `/` as `Overview` (with `also` equal to `[\"/labels\"]`), `/sessions` as `Sessions`, `/search` as `Search`, `/ask` as `Ask`, `/graph` as `Graph`. Development holds, in order, `/runs` as `Runs`, `/team` as `Team`, `/routing` as `Routing`, `/benchmark` as `Benchmark`, `/analysis` as `Analysis pipeline`. Library holds `/learn` as `Guides`. `SETTINGS_ITEM` is exported separately with href `/settings` and appears in no group."
  statement_sha: "sha256:6030f53ea23f8817f96c9dfbb6eb359a712cab96861143f2e625b9f3d9b04d9f"
  verifiers:
    - kind: deterministic
      test: "node studio/scripts/nav-check.mjs FR-2"
FR-3:
  statement: "The set of hrefs across `NAV_GROUPS` and `SETTINGS_ITEM` is exactly the twelve routes the navigation could reach before the regroup — `/`, `/sessions`, `/search`, `/ask`, `/graph`, `/runs`, `/team`, `/routing`, `/benchmark`, `/analysis`, `/learn`, `/settings` — with no route added, removed or redirected. `studio/lib/nav.ts` exports `activeNav(pathname)`, which returns the owning group and item for each of those twelve routes, returns the `/sessions` item for `/sessions/<id>`, returns the `/` item for `/labels/<label>`, and returns null for a path no item owns."
  statement_sha: "sha256:97f9f7d12c25d3db24738ead3302c91bc3451a0cb3aeabb2b225d524de542a86"
  verifiers:
    - kind: deterministic
      test: "node studio/scripts/nav-check.mjs FR-3"
FR-4:
  statement: "For every one of those paths, rendering the navigation produces exactly one element carrying `aria-current=\"page\"`, and that element is the item, never the group header; exactly one group is open, marked with `aria-expanded=\"true\"`. Because Settings belongs to no group, `activeNav` returns a null group for `/settings` and the renderer keeps the first group open, so the second row is never empty and the single marked element is Settings itself."
  statement_sha: "sha256:0e3532d06295ee0c62cc73d6071b001203185c3807071c3f74e4ff2d2a4045a3"
  verifiers:
    - kind: deterministic
      test: "node studio/scripts/nav-check.mjs FR-4"
FR-5:
  statement: "The release navigation gate in `tests/release/ui_checks.sh` asserts the new labels — the route-and-label pairs `/:Overview`, `/sessions:Sessions`, `/graph:Graph`, `/team:Team`, `/learn:Guides`, `/settings:Settings`, `/routing:Routing` and `/analysis:Analysis pipeline` — no longer asserts the retired pairs `/:Dashboard` or `/routing:Benchmark`, and still reads the marked element through a `[aria-current=page]` query so the single-marker promise keeps being measured rather than removed."
  statement_sha: "sha256:ed199c920f7721d68692a96150be6d7d408131a47896294e6e52cc658cf0cfd8"
  verifiers:
    - kind: deterministic
      test: "node studio/scripts/nav-check.mjs FR-5"
FR-6:
  statement: "No tracked file outside `specs/` and `doc_internal/` contains the string `Session Analytics Studio`, and the documentation that names the two renamed tabs refers to them by their new labels."
  statement_sha: "sha256:442069d0b79e0b73d5e36e070e45a212aaf0699a7ecbbb75349c443f9599a0a3"
  verifiers:
    - kind: deterministic
      test: "node studio/scripts/nav-check.mjs FR-6"
