status: finalized
feature_id: team-developer-aliases

FR-1:
  statement: "`load_config().team.aliases` is a mapping from developer id to display name, read from `team.aliases` in the config data file (default `{}`) with `CCT_SA_TEAM_ALIASES` on top in the form `id=Name,id2=Name` (entries separated by commas, each `id=name`, whitespace trimmed). A malformed entry (no `=`, empty id or name) raises `ValueError` at config load, and the message names `team.aliases`."
  statement_sha: "sha256:f29335b7d37db1df5345b29d5efbcb90b3a6f59b731be01ae2a3a53f68ddca05"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_identity.py -q -p no:cacheprovider -k alias_fr1"
FR-2:
  statement: "`api.team.team_status()` accepts an `aliases` mapping; every developer id that maps to the same display name is folded into one developer row whose `display_name` is that name, whose `developer_id` is the first of the folded ids in the order they appear in the mapping, and which carries `merged_ids` listing every folded id (including the first). A row for an unaliased id has `merged_ids` equal to `[developer_id]`."
  statement_sha: "sha256:6dd737af284d082241ab7fdbe74c4d4e48cbb77e7d938ff3e48c0b6980b8aec7"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_team.py -q -p no:cacheprovider -k alias_fr2"
FR-3:
  statement: "For a folded row, every window's `sessions`, `turns`, `priced_turns` and `priceable_turns` are the sums over the folded ids, `cost_usd` is the sum of the folded ids' priced costs (or null when none of them has a priced turn), `liveness` is the most recent of the folded ids' heartbeats, and `current` is that most recent heartbeat."
  statement_sha: "sha256:47b4c376c26ac9da56263b9722a9d2a9bc1cc46118fd2d52ceb99afa4c167d93"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_team.py -q -p no:cacheprovider -k alias_fr3"
FR-4:
  statement: "`GET /api/team/status` and `session-analytics team status` apply `load_config().team.aliases`, so the folded row appears in the API payload and in the CLI table; a display name from `team.aliases` takes precedence over the `developer` table's `display_name`."
  statement_sha: "sha256:8bcabd05e76c8be2bcda0c70527ce1a2be57e40e3dd3eb59f7bc23b9e1ef28b0"
  verifiers:
    - kind: deterministic
      test: "env PYTHONPATH=scripts:. python3 -m pytest scripts/session_analytics/tests/test_cli.py scripts/session_analytics/tests/test_team.py -q -p no:cacheprovider -k alias_fr4"
