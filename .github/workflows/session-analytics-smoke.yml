name: session-analytics-smoke

on:
  pull_request:
    paths:
      - 'scripts/session-analytics'
      - 'scripts/session_analytics/**'
      - 'studio/**'
      - 'specs/session-analytics/**'
      - '.github/workflows/session-analytics-smoke.yml'
  workflow_dispatch: {}

# Smoke test: run the unittest suite (SQLite, zero deps), then exercise the
# real PostgreSQL dialect by ingesting the committed fixture into a postgres
# service container and asserting the row counts. No LLM is invoked.
# Wall-time target: <90s on GitHub free runners.

# Least-privilege GITHUB_TOKEN: read-only (checkout + tests + read output).
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cct
          POSTGRES_PASSWORD: cct
          POSTGRES_DB: session_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cct -d session_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SA_DSN: "postgresql://cct:cct@localhost:5432/session_analytics"
      FIXTURE_ROOT: "scripts/session_analytics/tests/fixtures/claude_code"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install optional deps FIRST so the kuzu/fastapi/pyarrow-gated tests
      # actually run here (they skip when the package is absent).
      - name: Install psycopg + kuzu + fastapi + pyarrow + mcp (Postgres/graph/API/export/MCP paths)
        # mcp is pinned <2: the server targets FastMCP, which mcp 2.x
        # renamed (captured while wiring #287 T3).
        run: python3 -m pip install "psycopg[binary]>=3.1" "kuzu>=0.6" "fastapi>=0.110" "httpx>=0.27" "pyarrow>=14" "mcp>=1.0,<2"

      - name: Run unittest suite (graph + API tests included)
        run: |
          PYTHONPATH=scripts:. python3 -m unittest discover \
            -s scripts/session_analytics/tests -v

      - name: List adapters
        run: ./scripts/session-analytics list

      - name: Ingest fixture into PostgreSQL (full)
        run: |
          ./scripts/session-analytics ingest \
            --copilot claude-code --root "$FIXTURE_ROOT" \
            --dsn "$SA_DSN" --full

      - name: Re-ingest must be idempotent
        run: |
          ./scripts/session-analytics ingest \
            --copilot claude-code --root "$FIXTURE_ROOT" \
            --dsn "$SA_DSN" --full

      - name: Assert store counts
        run: |
          ./scripts/session-analytics doctor --dsn "$SA_DSN" > doctor.json
          cat doctor.json
          python3 - <<'PY'
          import json
          d = json.load(open("doctor.json"))["store"]
          assert d["dsn_dialect"] == "postgres", d
          assert d["sessions"] == 1, d            # exactly one, not duplicated
          assert d["turns"] == 6, d
          assert d["tool_calls"] == 2, d
          assert d["errors"] == 1, d
          print("OK", d)
          PY

      - name: Assert cost_usd populated under Postgres (E5)
        run: |
          python3 - <<'PY'
          import os
          import psycopg
          conn = psycopg.connect(os.environ["SA_DSN"])
          cur = conn.cursor()
          cur.execute(
              "SELECT model, cost_usd, cost_price_version FROM copilot_turn "
              "WHERE role = 'assistant' ORDER BY sequence_num"
          )
          rows = cur.fetchall()
          assert len(rows) == 3, rows
          for model, cost_usd, version in rows:
              assert model == "claude-opus-4-8", rows       # packaged defaults.json price the fixture's model
              assert cost_usd is not None and cost_usd > 0, rows
              assert version == "2026-05-01", rows          # defaults.json effective_date
          cur.execute("SELECT COUNT(*) FROM copilot_turn WHERE role = 'user' AND cost_usd IS NOT NULL")
          assert cur.fetchone()[0] == 0, "user turns must never be priced"
          print("OK cost_usd populated:", rows)
          PY

      - name: "Export CSV + Parquet round-trip against PostgreSQL (E7, #87)"
        run: |
          ./scripts/session-analytics export --format csv --table sessions --dsn "$SA_DSN" > sessions.csv
          head -1 sessions.csv | grep -q '^id,copilot,session_id' || { echo "unexpected CSV header"; cat sessions.csv; exit 1; }
          ./scripts/session-analytics export --format parquet --table all --out "$RUNNER_TEMP/export" --dsn "$SA_DSN"
          ls "$RUNNER_TEMP/export"
          python3 - <<PY
          import pyarrow.parquet as pq
          for table, expected_rows in (("sessions", 1), ("turns", 6), ("labels", 0), ("kpis", 0)):
              t = pq.read_table("$RUNNER_TEMP/export/" + table + ".parquet")
              assert t.num_rows == expected_rows, (table, t.num_rows)
          print("OK parquet round-trip")
          PY

      - name: "Ranked trace search under PostgreSQL (E10 Slice B, #65)"
        # MUST run before the per-project redaction step below. That step
        # ingests the fixture as `metadata-only`, and the archive stores
        # under the STRICTER of config and ingest-recorded mode (FR-4
        # floor) — leaving text with no searchable words in it.
        run: |
          mkdir -p ~/.cct
          cat > ~/.cct/session-analytics.json <<'JSON'
          {
            "projects": {
              "demo-project": { "trace_archive": true }
            },
            "project_ids": [
              { "match": "/repo/demo", "id": "demo-project" }
            ]
          }
          JSON
          ./scripts/session-analytics archive \
            --copilot claude-code --root "$FIXTURE_ROOT" \
            --dsn "$SA_DSN" --full
          python3 - <<'PY'
          import os
          import psycopg
          conn = psycopg.connect(os.environ["SA_DSN"])
          cur = conn.cursor()
          # The tsvector column is GENERATED, so it exists for every row
          # the archive wrote — no backfill step, and no way for it to
          # outlive its row.
          cur.execute("""
              SELECT count(*) FROM information_schema.columns
              WHERE table_name = 'trace_document' AND column_name = 'content_tsv'
          """)
          assert cur.fetchone() == (1,), "content_tsv column missing"
          cur.execute("SELECT count(*) FROM trace_document WHERE content_tsv IS NULL")
          assert cur.fetchone() == (0,), "unindexed archived rows"

          # Two rows with known term densities, so the ordering assertion
          # below has something to order. Neither holds the query as a
          # contiguous string, so the substring path scores zero on both.
          cur.execute("SELECT id FROM copilot_session LIMIT 1")
          ref = cur.fetchone()[0]
          # The DENSER document deliberately gets the HIGHER sequence
          # number. With it at the lower one, the slice A ordering
          # (session_ref, sequence_num) would return the same first row
          # as ts_rank and the ordering assertion below could not tell
          # the two apart — it would pass against the very behaviour it
          # exists to prove was replaced.
          for seq, text in (
              (9001, "alpha appears here with beta far away"),
              (9002, "alpha and beta appear here and alpha beta again"),
          ):
              cur.execute(
                  "INSERT INTO trace_document (session_ref, sequence_num,"
                  " source_kind, content, redaction_mode)"
                  " VALUES (%s, %s, %s, %s, %s)",
                  (ref, seq, "copilot_transcript", text, "code"),
              )
          conn.commit()
          cur.execute(
              "SELECT count(*) FROM trace_document WHERE LOWER(content) LIKE %s",
              ("%beta alpha%",),
          )
          assert cur.fetchone() == (0,), "probe is contiguous; not a real test"
          print("OK generated column populated; ranking probe seeded")
          PY

          # Through the APPLICATION path, not raw SQL: this exercises
          # search_traces -> detect_index -> the tsvector/ts_rank query.
          ./scripts/session-analytics search "beta alpha" \
            --dsn "$SA_DSN" > search.json
          python3 - <<'PY'
          import json
          results = json.load(open("search.json"))["results"]
          assert results, "ranked search returned nothing through the CLI"
          seqs = [r["sequence_num"] for r in results]
          # Reversed word order, with intervening words — unanswerable by
          # the substring path. And ORDER is the contract: 9002 is the
          # denser document AND the higher sequence_num, so this passes
          # only under ts_rank. The slice A ordering would put 9001
          # first and fail here, which is the point.
          assert 9001 in seqs and 9002 in seqs, seqs
          assert seqs[0] == 9002, f"not ranked best-first: {seqs}"
          print("OK postgres ranked search via the CLI:", seqs)
          PY

          python3 - <<'PY'
          import os
          import psycopg
          conn = psycopg.connect(os.environ["SA_DSN"])
          cur = conn.cursor()
          # A purge must take the index with it — the column cannot
          # survive its row, which is the point of GENERATED here.
          cur.execute("DELETE FROM trace_document")
          conn.commit()
          cur.execute("SELECT count(*) FROM trace_document WHERE content_tsv IS NOT NULL")
          assert cur.fetchone() == (0,), "index text survived a purge"
          print("OK purge reaches the index")
          PY
          rm -f ~/.cct/session-analytics.json search.json

      - name: "Per-project redaction override survives PostgreSQL (E8, #84)"
        run: |
          mkdir -p ~/.cct
          cat > ~/.cct/session-analytics.json <<'JSON'
          {
            "projects": {
              "demo-project": { "redaction_mode": "metadata-only" }
            },
            "project_ids": [
              { "match": "/repo/demo", "id": "demo-project" }
            ]
          }
          JSON
          ./scripts/session-analytics ingest \
            --copilot claude-code --root "$FIXTURE_ROOT" \
            --dsn "$SA_DSN" --full
          python3 - <<'PY'
          import os
          import psycopg
          conn = psycopg.connect(os.environ["SA_DSN"])
          cur = conn.cursor()
          cur.execute("SELECT redaction_mode FROM copilot_session")
          rows = cur.fetchall()
          assert rows == [("metadata-only",)], rows  # per-project override, not the global 'code' default
          print("OK per-project override under Postgres:", rows)
          PY
          rm -f ~/.cct/session-analytics.json

      - name: Build + assert the Kùzu graph
        run: |
          ./scripts/session-analytics graph --rebuild \
            --dsn "$SA_DSN" --db-path "$RUNNER_TEMP/kuzu" > graph.json
          cat graph.json
          python3 - <<'PY'
          import json
          d = json.load(open("graph.json"))["node_counts"]
          assert d["Session"] == 1, d
          assert d["Turn"] == 6, d
          assert d["ToolInvocation"] == 2, d
          assert d["FileNode"] == 1, d
          assert d["ErrorNode"] == 1, d
          print("OK", d)
          PY

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the Studio (type-check + production build)
        working-directory: studio
        run: |
          npm install
          npm run build
