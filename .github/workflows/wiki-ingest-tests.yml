name: Wiki Ingest Tests

# CCT's thin contract over the wiki-studio engine (#384): the exact hashed
# wheel is installed into a venv by the same installer users run, then the
# launcher, schema-reconciliation and five-verb contract suites run against
# it on every Python the package supports (3.11–3.13). The engine's own
# unit tests are upstream's; nothing here imports package internals.
#
# No paths filter, on purpose: the five-verb contract runs on a copy of the
# CURRENT knowledge/wiki/ plus every file its pages cite elsewhere in the
# checkout, and the schema suite drives `cct doctor`, so the set of inputs
# is dynamic and a hand-written filter would always be incomplete (the
# first attempt listed the launcher, lock, schema and suites and missed
# the wiki pages themselves). Three jobs of a few minutes on every PR is
# the honest cost of FR-9's "a copy of CCT's current wiki".

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: this workflow reads code and runs tests; it never
# writes to issues, PRs, packages, or any other GH surface.
permissions:
  contents: read

jobs:
  test:
    name: Wiki contract against the locked wiki-studio (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # wiki-studio 0.9.0 declares >=3.11,<3.14; every supported minor.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        # Pin to a SHA so an upstream tag re-point cannot inject code
        # into our CI. v4.3.1 as of 2026-05-06.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        # Pin to a SHA — same rationale. v5.6.0 as of 2026-05-06.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked wiki-studio into the managed venv
        # The same installer users run; --require because this job exists
        # to test the wiki and must not pass with it absent. The matrix
        # interpreter is the only candidate.
        env:
          CCT_WIKI_PYTHON: python
        run: bash scripts/setup-wiki.sh --require

      - name: Managed install (setup-wiki.sh, root setup, the Claude Code adapter's venv)
        run: bash tests/test-wiki-setup.sh

      - name: Launcher contract
        run: bash tests/test-wiki-launcher.sh

      - name: Schema reconciliation and fingerprint
        run: bash tests/test-wiki-schema.sh

      - name: Five-verb contract (ingest, promote, query, lint, audit-flush)
        run: bash tests/test-wiki-ingest.sh

  # One check named exactly `Wiki contract`, whatever the matrix does: the
  # name the master ruleset requires once this workflow is on master (added
  # after merge, so open PRs based on older master are not blocked by a
  # check they cannot produce). Same pattern as codeql.yml's `CodeQL` job.
  wiki-contract:
    name: Wiki contract
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Python leg succeeded
        run: |
          echo "test result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
