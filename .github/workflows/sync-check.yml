name: Adapter Sync Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run generator
        run: bash scripts/generate.sh

      - name: Check for drift
        run: |
          # Stage first: `git diff` reports modified tracked files but is blind
          # to newly generated untracked ones, so a brand-new generated file
          # (e.g. a prompt for a newly added command) passed this check while
          # being absent from the repo.
          git add -A adapters/
          if ! git diff --cached --exit-code adapters/; then
            echo ""
            echo "ERROR: Generated adapter configs are out of sync with shared/."
            echo "Run './scripts/generate.sh' and commit the updated outputs."
            exit 1
          fi
          echo "Adapters are in sync with shared/."

      - name: Validate workflows
        run: bash scripts/validate-workflows.sh

      - name: Validate hardening scripts
        run: |
          bash -n scripts/apply-branch-protection.sh
          bash -n scripts/check-github-hardening.sh
          bash -n scripts/harden-github.sh
          bash -n scripts/validate-spec.sh
          bash -n scripts/validate-pitch.sh
          bash -n scripts/check-origin-alignment.sh
          bash -n scripts/auto-build-loop.sh
          bash -n scripts/generate-claude-settings.sh
          bash -n scripts/cooldown-supervisor.sh
          bash -n scripts/providers-health.sh

      - name: Run generation tests
        run: bash tests/test-generate.sh

      - name: Run hook tests
        run: bash tests/test-hooks.sh

      - name: Run sync tests
        run: bash tests/test-sync.sh

      - name: Run peer-review runner tests
        run: bash tests/test-peer-review.sh

      - name: Run review loop integration tests
        run: bash tests/test-review-loop.sh

      - name: Run provider-emit translator tests
        run: bash tests/test-provider-emit.sh

      - name: Run provider adapter --provider wiring tests
        run: bash tests/test-provider-setup.sh

      - name: Run Claude settings generator tests (US2 unattended posture)
        run: bash tests/test-claude-settings-gen.sh

      - name: Cross-harness permission drift guard (FR-8)
        run: bash scripts/generate-claude-settings.sh relaxed --settings adapters/claude-code/.claude/settings.json --check

      - name: Run automation-config validator tests (#191)
        run: |
          bash -n scripts/validate-automation-config.sh
          bash tests/test-automation-config.sh

      - name: Run claude-code launcher tests (#195)
        run: |
          bash -n adapters/claude-code/claude-code
          bash -n adapters/claude-code/setup.sh
          bash tests/test-claude-code-launcher.sh

      - name: Run auto-build loop tests
        run: bash tests/test-auto-build-loop.sh

      - name: Run cooldown supervisor tests (US4 unattended resume)
        run: bash tests/test-cooldown-supervisor.sh

      - name: Run origin-alignment tests
        run: bash tests/test-origin-alignment.sh

      - name: Run shared structure tests
        env:
          HOME: ${{ runner.temp }}/cct-home
        run: |
          mkdir -p "$HOME"
          bash adapters/claude-code/setup.sh
          bash tests/test-shared-structure.sh

      - name: Validate collaboration artifacts
        run: |
          if [[ -d specs/ ]]; then
            bash scripts/validate-collaboration.sh
          else
            echo "No specs/ directory; skipping collaboration validation"
          fi

      - name: Validate spec conformance
        run: |
          if [[ -d specs/ ]] && { ls specs/*/plan.md >/dev/null 2>&1 || ls specs/pitches/*/plan.md >/dev/null 2>&1; }; then
            bash scripts/validate-spec.sh --all
          else
            echo "No spec artifacts found; skipping validation"
          fi

      - name: Validate Shape-Up pitch conformance
        run: |
          if [[ -d specs/pitches/ ]] && ls specs/pitches/*/pitch.md >/dev/null 2>&1; then
            bash scripts/validate-pitch.sh --all
          else
            echo "No Shape-Up pitches found; skipping pitch validation"
          fi
